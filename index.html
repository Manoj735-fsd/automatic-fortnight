<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Header</title>
    <link rel="stylesheet" href="style.css">
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
        }
        header {
            background-color: #2c3e50;
            color: #ffffff;
            padding: 15px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .logo {
            font-size: 22px;
            font-weight: bold;
            color: #ffffff;
            text-decoration: none;
        }
        nav a {
            color: #ffffff;
            text-decoration: none;
            margin-left: 20px;
        }
        nav a:hover {
            color: #3498db;
        }


* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

.footer {
    background: #111827;
    color: #f9fafb;
    padding: 45px 8% 20px;
    font-family: Arial, sans-serif;
}

.footer-content {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    flex-wrap: wrap;
    gap: 30px;
    padding-bottom: 35px;
}

.footer-logo h2 {
    font-size: 24px;
    margin-bottom: 10px;
}

.footer-logo p {
    color: #9ca3af;
    font-size: 14px;
}

.footer-links,
.footer-socials {
    display: flex;
    flex-direction: column;
    gap: 12px;
}

.footer a {
    color: #9ca3af;
    text-decoration: none;
    font-size: 14px;
    transition: color 0.3s ease;
}

.footer a:hover {
    color: #ffffff;
}

.footer-bottom {
    border-top: 1px solid #374151;
    padding-top: 20px;
    display: flex;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 12px;
    color: #9ca3af;
    font-size: 13px;
}

@media (max-width: 600px) {
    .footer-content {
        flex-direction: column;
        gap: 25px;
    }

    .footer-bottom {
        flex-direction: column;
        text-align: center;
    }
}

    </style>
</head>
<body>
    <header>
        <a href="#" class="logo">MyWebsite</a>
        <nav>
            <a href="#">Home</a>
            <a href="#">About</a>
            <a href="#">Services</a>
            <a href="#">Contact</a>
        </nav>
    </header>
</body>

<footer class="footer">
    <div class="footer-content">
        <div class="footer-logo">
            <h2>Ujjawal Sharma</h2>
            <p>Full Stack Developer | MERN Stack</p>
        </div>

        <div class="footer-links">
            <a href="#home">Home</a>
            <a href="#about">About</a>
            <a href="#projects">Projects</a>
            <a href="#contact">Contact</a>
        </div>

        <div class="footer-socials">
            <a href="https://github.com/ujjawalb01" target="_blank">GitHub</a>
            <a href="https://linkedin.com/" target="_blank">LinkedIn</a>
        </div>
    </div>

    <div class="footer-bottom">
        <p>&copy; 2026 Ujjawal Sharma. All rights reserved.</p>
        <p>Designed & Built with HTML and CSS</p>
    </div>
</footer>

  
</html>
